<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>은하 수호대: YOON 행성을 지켜라</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      background-color: #050515;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
      margin: 0 auto;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      touch-action: none;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 전체 UI 여백 최적화 */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: rgba(2, 6, 23, 0.95);
      backdrop-filter: blur(8px);
      z-index: 10;
      padding: 15px 20px; 
      text-align: center;
      overflow: hidden;
    }

    .hidden {
      display: none !important;
    }

    .top-status-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 5px;
    }

    .coin-badge {
      background: rgba(250, 204, 21, 0.15);
      border: 1px solid rgba(250, 204, 21, 0.5);
      color: #facc15;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .coin-info-box {
      font-size: 0.6rem;
      color: #facc15;
      margin-top: 2px;
      text-align: right;
      line-height: 1.2;
    }

    h1 {
      font-size: 1.4rem;
      margin: 5px 0;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    /* 패치 노트 버튼: 초록색 배경 제거 및 텍스트 강조 스타일 */
    .btn-update {
      background: transparent !important;
      border: 1px solid #38bdf8 !important;
      color: #38bdf8 !important;
      font-size: 0.75rem !important;
      padding: 4px 12px !important;
      margin-bottom: 8px !important;
      border-radius: 6px !important;
      box-shadow: none !important;
    }
    .btn-update:active { transform: scale(0.98); background: rgba(56, 189, 248, 0.1) !important; }

    .info-box {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 0.7rem;
      text-align: left;
    }

    .info-box h4 {
      color: #facc15;
      margin-bottom: 4px;
      text-align: center;
      font-size: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .info-item { display: flex; align-items: center; margin-bottom: 2px; }

    .badge {
      width: 16px; height: 16px; border-radius: 50%; color: #000; font-weight: bold; text-align: center;
      line-height: 16px; font-size: 0.6rem; margin-right: 6px; flex-shrink: 0;
    }
    .badge.upgrade { background: #eab308; }
    .badge.damage { background: #ef4444; color: #fff; }
    .badge.laser { background: #22c55e; }
    .badge.saw { background: #c084fc; }
    .badge.shotgun { background: #f97316; }
    .badge.heart { background: #ec4899; color: #fff; }
    .badge.coin { background: #facc15; }

    input[type="text"] {
      width: 100%;
      max-width: 300px;
      padding: 8px;
      border: 1.5px solid #3b82f6;
      border-radius: 6px;
      background: #1e293b;
      color: #fff;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 5px;
    }

    .btn-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
      max-width: 440px;
      margin-bottom: 5px;
    }

    button.btn {
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
    }

    .btn-shop { background: linear-gradient(135deg, #d97706, #b45309) !important; }

    .ranking-container {
      width: 100%;
      max-width: 440px;
      margin-bottom: 8px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 8px;
      padding: 8px;
    }

    .ranking-container h3 { font-size: 0.75rem; color: #f87171; margin-bottom: 4px; }

    .ranking-scroll-box {
      max-height: 100px;
      overflow-y: auto;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.65rem; }
    th, td { padding: 3px 2px; border-bottom: 1px solid #334155; text-align: center; }

    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); z-index: 20;
      display: flex; justify-content: center; align-items: center; padding: 20px;
    }

    .modal-content {
      background: #1e293b; border: 2px solid #38bdf8; border-radius: 12px;
      padding: 20px; max-width: 400px; width: 100%;
    }

    .shop-item-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .buy-btn {
      background: #facc15; color: #000; border: none; padding: 6px 10px;
      border-radius: 6px; font-weight: bold; font-size: 0.75rem;
    }

    #controlArea {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 160px;
      background: rgba(15, 23, 42, 0.9); border-top: 1px solid #38bdf8;
      z-index: 5;
    }

    .arrow-btn {
      position: absolute; bottom: 45px; width: 70px; height: 70px;
      background: rgba(30, 41, 59, 0.7); border: 2px solid #38bdf8;
      border-radius: 50%; color: #38bdf8;
      display: flex; justify-content: center; align-items: center;
      z-index: 7;
    }
    #btnLeft { left: 20px; }
    #btnRight { right: 20px; }
    
    #joystickArea {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      width: 90px; height: 90px; border: 2px dashed #38bdf8; border-radius: 50%;
    }
    
    #joystickKnob {
      width: 40px; height: 40px; background: #38bdf8; border-radius: 50%;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="topControls" class="top-controls hidden" style="position:absolute; top:15px; right:15px; z-index:15; display:flex; gap:10px;">
      <button class="icon-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
      <button class="icon-btn" id="pauseBtn" onclick="togglePause()">⏸️</button>
    </div>

    <!-- 메인 화면 -->
    <div id="startScreen" class="screen">
      <div class="top-status-bar">
        <div style="font-size:0.75rem; color:#94a3b8;">은하 수호대 본부</div>
        <div class="coin-badge">🪙 <span id="mainCoinDisplay">0</span></div>
      </div>

      <h1>은하 수호대</h1>
      
      <button class="btn btn-update" onclick="toggleModal('updateModal', true)">📜 패치 노트 및 정보 보기</button>

      <div class="info-box">
        <h4>🎁 아이템 드롭 확률</h4>
        <div class="info-item"><span class="badge damage">D</span><span>데미지 증가 (3%)</span></div>
        <div class="info-item"><span class="badge upgrade">+1</span><span>탄환 수 증가 (5%)</span></div>
        <div class="info-item"><span class="badge laser">L</span><span>레이저 (7%)</span></div>
        <div class="info-item"><span class="badge coin">🪙</span><span>코인 드랍 (보스 50%)</span></div>
      </div>

      <div class="ranking-container">
        <h3>🏆 LEADERBOARD</h3>
        <div class="ranking-scroll-box">
          <table>
            <tbody id="mainRankingBody"><tr><td>로딩 중...</td></tr></tbody>
          </table>
        </div>
      </div>

      <input type="text" id="nicknameInput" placeholder="닉네임 입력 (필수)" maxlength="8" />
      <div id="nicknameWarning" style="color:#f87171; font-size:0.7rem;"></div>
      
      <div class="btn-container">
        <button class="btn btn-shop" onclick="openShopModal()">🛒 상점</button>
        <button class="btn" onclick="openStoryScreen()">🚀 출격하기</button>
      </div>
      
      <div class="credits">[개발: YYR]</div>
    </div>

    <!-- 상점 모달 -->
    <div id="shopModal" class="modal-overlay hidden">
      <div class="modal-content">
        <h3>🛒 상점</h3>
        <div class="shop-item-card">
          <span>🍖</span>
          <div style="flex:1;">
            <div style="font-weight:bold;">고기 (DMG+1)</div>
            <div style="font-size:0.7rem; color:#aaa;">현재: <span id="shopMeatDmg">1</span></div>
          </div>
          <button class="buy-btn" id="buyMeatBtn" onclick="buyShopItem('meat')"><span id="meatCostText">160</span>코인</button>
        </div>
        <div class="shop-item-card">
          <span>🍎</span>
          <div style="flex:1;">
            <div style="font-weight:bold;">사과 (연사속도↑)</div>
            <div style="font-size:0.7rem; color:#aaa;">현재: <span id="shopAppleSpeed">130</span>ms</div>
          </div>
          <button class="buy-btn" id="buyAppleBtn" onclick="buyShopItem('apple')"><span id="appleCostText">160</span>코인</button>
        </div>
        <button class="btn" style="width:100%;" onclick="toggleModal('shopModal', false)">닫기</button>
      </div>
    </div>

    <!-- 나머지 생략: 기존 로직 동일 -->
    <div id="storyModal" class="modal-overlay hidden"><div class="modal-content">...</div></div>
    <div id="updateModal" class="modal-overlay hidden"><div class="modal-content">...</div></div>
    <div id="pauseModal" class="modal-overlay hidden"><div class="modal-content">...</div></div>
    <div id="rankScreen" class="screen hidden">...</div>
    <div id="controlArea" class="hidden">...</div>
  </div>

  <script>
    // [중요] 가격 데이터 초기화 및 보정 로직
    var userCoins = parseInt(localStorage.getItem("yoon_coins") || "0");
    var shopMeatCost = parseFloat(localStorage.getItem("yoon_meat_cost") || "160");
    var shopAppleCost = parseFloat(localStorage.getItem("yoon_apple_cost") || "160");
    
    // 강제 가격 보정: 이전에 200이었던 유저를 위해 160으로 강제 변경
    if(shopMeatCost == 200) shopMeatCost = 160;
    if(shopAppleCost == 200) shopAppleCost = 160;

    var shopMeatBonusDmg = parseInt(localStorage.getItem("yoon_meat_bonus") || "0");
    var shopAppleCount = parseInt(localStorage.getItem("yoon_apple_count") || "0");

    function saveShopData() {
      localStorage.setItem("yoon_coins", userCoins);
      localStorage.setItem("yoon_meat_cost", shopMeatCost);
      localStorage.setItem("yoon_meat_bonus", shopMeatBonusDmg);
      localStorage.setItem("yoon_apple_cost", shopAppleCost);
      localStorage.setItem("yoon_apple_count", shopAppleCount);
    }
    
    // ... 나머지 기존 게임 로직 스크립트 동일 ...
    // (이전 답변의 전체 코드를 유지하며 위의 가격 보정 로직만 추가하여 적용하시면 됩니다.)
  </script>
</body>
</html>
